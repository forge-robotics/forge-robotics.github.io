<style>
  html, body { margin:0; padding:0; }
  * { box-sizing:border-box; }
  body { -webkit-font-smoothing:antialiased; }
  a { color:var(--color-accent-700); }
  a:hover { color:var(--color-accent); }
  .btn-primary { background: var(--color-accent); color: var(--color-bg); }
  .btn-primary:hover, .btn-primary:active { background: var(--color-accent-700); color: var(--color-bg); }
  .grayscale { transition: filter 0.35s ease; }
  .grayscale:hover, article:hover .grayscale { filter: none; }

<div style="background:var(--color-bg); color:var(--color-text); min-height:100vh; font-family:var(--font-body); max-width:1560px; margin:0 auto; padding:0 clamp(var(--space-4), 5.5vw, 96px)">

  <dc-import name="SiteHeader" current="news.html" hint-size="100%,72px"></dc-import>

  <section style="margin-top:clamp(28px, 4vw, 64px); padding:clamp(32px, 4vw, 56px) 0 clamp(24px, 3vw, 40px)">
    <h1 style="font-family:var(--font-heading); font-weight:800; font-size:clamp(44px, 8vw, 112px); line-height:0.92; letter-spacing:-0.035em; margin:0 0 24px">News</h1>
    <p style="font-size:clamp(18px, 1.9vw, 24px); line-height:1.4; margin:0; max-width:52ch; color:var(--color-neutral-800); text-wrap:pretty">{{ countLabel }}</p>
  </section>

  <section style="margin-top:clamp(20px, 2.4vw, 32px)">
    <sc-for list="{{ items }}" as="item" hint-placeholder-count="3">
      <article style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(300px, 100%), 1fr)); column-gap:clamp(24px, 3vw, 56px); row-gap:20px; align-items:start; padding:clamp(28px, 3.4vw, 44px) 0; border-top:1px solid var(--color-neutral-300)">
        <div style="display:flex; flex-direction:column; gap:12px; min-width:0">
          <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:baseline">
            <div style="font-size:13px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-neutral-700)">{{ item.dateLabel }}</div>
            <div style="font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; padding:3px 8px; background:var(--color-accent-200); color:var(--color-accent-700)">{{ item.tag }}</div>
          </div>
          <h2 style="font-family:var(--font-heading); font-weight:800; font-size:clamp(26px, 3vw, 40px); line-height:1.02; letter-spacing:-0.025em; margin:0; text-wrap:pretty">
            <sc-if value="{{ item.hasLink }}" hint-placeholder-val="{{ false }}"><a href="{{ item.link }}" style="color:var(--color-text); text-decoration:none" style-hover="color:var(--color-accent-700)">{{ item.title }}</a></sc-if>
            <sc-if value="{{ item.noLink }}" hint-placeholder-val="{{ true }}"><span>{{ item.title }}</span></sc-if>
          </h2>
          <p style="font-size:clamp(16px, 1.6vw, 19px); line-height:1.5; margin:0; color:var(--color-neutral-800); text-wrap:pretty">{{ item.body }}</p>
          <sc-if value="{{ item.hasLink }}" hint-placeholder-val="{{ false }}">
            <a href="{{ item.link }}" style="align-self:flex-start; margin-top:4px; font-size:13px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-accent-700); text-decoration:none; line-height:1.2; padding-bottom:4px; border-bottom:2px solid var(--color-accent); transition:color 180ms ease, border-color 180ms ease" style-hover="color:var(--color-accent)">{{ item.readLabel }}</a>
          </sc-if>
        </div>
        <sc-if value="{{ item.hasPhoto }}" hint-placeholder-val="{{ false }}">
          <div class="grayscale" style="position:relative; width:100%; aspect-ratio:16 / 10; background:var(--color-neutral-300)">
            <div role="img" aria-label="{{ item.title }}" style="{{ item.photoStyle }}"></div>
          </div>
        </sc-if>
      </article>
    </sc-for>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1000}}">
// News is read live from the lab Google Sheet (published to the web, CSV via gviz).
const SHEET_ID = '186So6cB9ius-DlQV-dBgqmnEMb4Qc1BY-PN1KyfxgRQ';
const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false; }
      else cell += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function toObjects(rows) {
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim().toLowerCase());
  return rows.slice(1).map(r => {
    const o = {};
    head.forEach((h, i) => { if (h) o[h] = (r[i] || '').trim(); });
    return o;
  }).filter(o => o.title);
}

function driveImage(url) {
  if (!url) return '';
  const m = /\/file\/d\/([^/]+)/.exec(url) || /[?&]id=([^&]+)/.exec(url);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200' : url;
}

// Accepts MM/DD/YYYY or YYYY-MM-DD; returns {sort, label}.
function parseDate(raw) {
  const s = String(raw || '').trim();
  let y, mo, d;
  let m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
  if (m) { mo = +m[1]; d = +m[2]; y = +m[3]; }
  else {
    m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
    if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  }
  if (!y) return { sort: '', label: s };
  const pad = n => String(n).padStart(2, '0');
  return { sort: y + '-' + pad(mo) + '-' + pad(d), label: MONTHS[mo - 1] + ' ' + d + ', ' + y };
}

function sourceOf(url) {
  const m = /^https?:\/\/(?:www\.)?([^/]+)/.exec(url || '');
  return m ? m[1] : '';
}

// Photos normally come from the sheet's photo-link column; these override by headline.
const LOCAL_PHOTOS = {
  'FORGE Lab starts at NC State': { src: 'assets/news-forge-open.png', contain: true }
};

class Component extends DCLogic {
  state = { rows: [], failed: false };

  componentDidMount() {
    fetch(SHEET_CSV)
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(t => this.setState({ rows: toObjects(parseCSV(t)) }))
      .catch(() => this.setState({ failed: true }));
  }

  renderVals() {
    const items = this.state.rows.map(n => {
      const d = parseDate(n.date);
      const link = n['news link'] || '';
      const local = LOCAL_PHOTOS[(n.title || '').trim()];
      const photo = local ? local.src : driveImage(n['photo link']);
      return {
        sort: d.sort,
        dateLabel: d.label,
        tag: n.tabs || 'News',
        title: n.title,
        body: n.description || '',
        link,
        hasLink: !!link,
        noLink: !link,
        hasPhoto: !!photo,
        photoStyle: {
          position: 'absolute', inset: 0,
          backgroundSize: local && local.contain ? 'contain' : 'cover',
          backgroundRepeat: 'no-repeat',
          backgroundColor: local && local.contain ? '#ffffff' : 'transparent',
          backgroundPosition: 'center', backgroundImage: 'url("' + photo + '")'
        },
        readLabel: link ? 'Read on ' + (sourceOf(link) || 'the source') + ' →' : ''
      };
    }).sort((a, b) => b.sort.localeCompare(a.sort));

    return {
      items,
      countLabel: items.length
        ? 'What the lab has been doing, newest first.'
        : (this.state.failed ? 'News is unavailable right now.' : 'Nothing posted yet.')
    };
  }
}
</script>
</body>
